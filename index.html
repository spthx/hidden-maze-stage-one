<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071310" />
    <meta
      name="description"
      content="壁と出口反応を手掛かりに、暗闇の迷宮を20手以内で抜ける1ステージ試作版。"
    />
    <title>HIDDEN MAZE - 1 Stage Prototype</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">FIELD NOTE // 01</p>
          <h1>HIDDEN MAZE</h1>
        </div>
        <div class="stage-seal" aria-label="ステージ1">
          <span>STAGE</span>
          <strong>01</strong>
        </div>
      </header>

      <section class="mission" aria-label="遊び方">
        <span class="mission-mark" aria-hidden="true"></span>
        <p>壁を探り、出口反応を頼りに20手以内で脱出せよ。</p>
      </section>

      <section class="status-grid" aria-label="ゲーム状況">
        <article class="status-card moves-card">
          <div class="status-label">
            <span>残り手数</span>
            <span id="moves-used">0 / 20</span>
          </div>
          <strong id="moves-left">20</strong>
          <div class="moves-meter" aria-hidden="true">
            <span id="moves-meter-fill"></span>
          </div>
        </article>

        <article class="status-card signal-card" id="signal-card">
          <div class="status-label">
            <span>出口反応</span>
            <span id="signal-trend">観測開始</span>
          </div>
          <strong id="exit-distance">9</strong>
          <span class="signal-unit">BLOCKS</span>
        </article>
      </section>

      <section class="board-section" aria-label="迷宮盤面">
        <div class="board-frame" id="board-frame">
          <div
            id="maze-grid"
            class="maze-grid"
            role="grid"
            aria-label="6行6列の暗闇の迷宮"
          ></div>
          <div class="board-noise" aria-hidden="true"></div>
        </div>

        <div class="legend" aria-label="盤面の凡例">
          <span><i class="legend-chip unknown-chip"></i>未探索</span>
          <span><i class="legend-chip route-chip"></i>通過</span>
          <span><i class="legend-chip wall-chip"></i>発見した壁</span>
        </div>
      </section>

      <section
        id="message-panel"
        class="message-panel"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="message-pulse" aria-hidden="true"></span>
        <p id="event-message">現在地以外は闇に包まれている。</p>
      </section>

      <section class="controls" aria-label="移動操作">
        <button class="move-button move-up" data-direction="up" aria-label="上へ移動">
          <span aria-hidden="true">▲</span>
          <small>UP</small>
        </button>
        <button class="move-button move-left" data-direction="left" aria-label="左へ移動">
          <span aria-hidden="true">◀</span>
          <small>LEFT</small>
        </button>
        <button class="move-button move-down" data-direction="down" aria-label="下へ移動">
          <span aria-hidden="true">▼</span>
          <small>DOWN</small>
        </button>
        <button class="move-button move-right" data-direction="right" aria-label="右へ移動">
          <span aria-hidden="true">▶</span>
          <small>RIGHT</small>
        </button>
      </section>

      <section id="result-panel" class="result-panel" hidden>
        <p class="result-kicker" id="result-kicker">EXPEDITION COMPLETE</p>
        <h2 id="result-title">STAGE CLEAR</h2>
        <div class="result-stats">
          <div><span>使用手数</span><strong id="result-moves">0</strong></div>
          <div><span>最短手数</span><strong id="result-shortest">0</strong></div>
          <div><span>壁衝突</span><strong id="result-hits">0</strong></div>
          <div class="rank-stat"><span>評価</span><strong id="result-rank">S</strong></div>
        </div>
        <div class="result-legend">
          <span><i class="shortest-line"></i>最短経路</span>
          <span><i class="actual-line"></i>実際の経路</span>
        </div>
        <button class="primary-action" id="retry-button">もう一度探索する</button>
      </section>

      <footer class="utility-bar">
        <button id="restart-button" class="utility-button">↻ リスタート</button>
        <button id="sound-button" class="utility-button" aria-pressed="false">
          ◉ サウンド ON
        </button>
        <p>KEYBOARD: ARROWS / WASD</p>
      </footer>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
